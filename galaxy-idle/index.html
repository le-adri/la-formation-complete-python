<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Galaxy Idle</title>
</head>

<body>
    <h1>Galaxy Idle</h1>
    <p>Poussières d'étoiles : <span id="poussiere">0</span></p>
    <p>Production totale : <span id="productionTotale">0</span>/seconde</p>
    <button onclick="recolter(1)">Récolter</button>
    <button onclick="recolter(5)">Récolter par 5</button>

    <!-- Les bâtiments sont créés automatiquement à partir de la liste en JavaScript -->
    <div id="batiments"></div>

    <script>
        let poussiere = 0;

        // Pour ajouter un nouvel objet à acheter, il suffit d'ajouter une ligne ici !
        const batiments = [
            { id: "sonde",     nom: "Sonde",            pluriel: "Sondes",             prix: 10,      production: 1,    quantite: 0 },
            { id: "satellite", nom: "Satellite",        pluriel: "Satellites",         prix: 100,     production: 8,    quantite: 0 },
            { id: "station",   nom: "Station spatiale", pluriel: "Stations spatiales", prix: 1100,    production: 47,   quantite: 0 },
            { id: "vaisseau",  nom: "Vaisseau minier",  pluriel: "Vaisseaux miniers",  prix: 12000,   production: 260,  quantite: 0 },
            { id: "colonie",   nom: "Colonie lunaire",  pluriel: "Colonies lunaires",  prix: 130000,  production: 1400, quantite: 0 },
            { id: "dyson",     nom: "Sphère de Dyson",  pluriel: "Sphères de Dyson",   prix: 1400000, production: 7800, quantite: 0 },
        ];

        const MULTIPLICATEUR_PRIX = 1.15;

        // Crée le HTML (texte + bouton) de chaque bâtiment, une seule fois au démarrage
        function creerBatiments() {
            const conteneur = document.getElementById("batiments");
            for (const batiment of batiments) {
                conteneur.innerHTML += `
                    <p>${batiment.pluriel} : <span id="quantite-${batiment.id}">0</span>
                       (production : <span id="production-${batiment.id}">0</span>/seconde)</p>
                    <button id="bouton-${batiment.id}" onclick="acheter('${batiment.id}')">
                        Acheter : ${batiment.nom} (<span id="prix-${batiment.id}">${batiment.prix}</span> poussières)
                    </button>`;
            }
        }

        function productionTotale() {
            let total = 0;
            for (const batiment of batiments) {
                total += batiment.quantite * batiment.production;
            }
            return total;
        }

        function afficher() {
            document.getElementById("poussiere").textContent = Math.floor(poussiere);
            document.getElementById("productionTotale").textContent = productionTotale();

            for (const batiment of batiments) {
                document.getElementById("quantite-" + batiment.id).textContent = batiment.quantite;
                document.getElementById("production-" + batiment.id).textContent = batiment.quantite * batiment.production;
                document.getElementById("prix-" + batiment.id).textContent = Math.ceil(batiment.prix);
                // Le bouton est grisé si on n'a pas assez de poussières
                document.getElementById("bouton-" + batiment.id).disabled = poussiere < batiment.prix;
            }
        }

        function recolter(quantite) {
            poussiere += quantite;
            afficher();
        }

        function acheter(id) {
            const batiment = batiments.find(b => b.id === id);
            if (poussiere >= batiment.prix) {
                poussiere -= batiment.prix;
                batiment.quantite += 1;
                batiment.prix *= MULTIPLICATEUR_PRIX;
                afficher();
            } else {
                console.log("Pas assez de poussières !");
            }
        }

        // Appelée 10 fois par seconde : on ajoute donc 1/10 de la production par seconde
        function produire() {
            poussiere += productionTotale() / 10;
            afficher();
        }

        creerBatiments();
        afficher();
        setInterval(produire, 100);
    </script>
</body>

</html>
